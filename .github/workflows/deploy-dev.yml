name: 🚀 Deploy to Development

on:
  push:
    branches: [dev]
  workflow_dispatch:
  workflow_run:
    workflows: ['🔍 Pull Request Checks']
    types: [completed]
    branches: [dev]

env:
  NODE_VERSION: '22.18.0'
  DEPLOY_ENV: 'development'

jobs:
  deploy-dev:
    name: Deploy to Development Server
    runs-on: ubuntu-latest
    environment: dev
    # Only run if PR checks passed or if triggered manually
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: 📦 Install dependencies
        run: yarn install --frozen-lockfile

      - name: 🧪 Run tests with conditional coverage
        run: |
          echo "🧪 Running tests..."
          if [ "${{ secrets.BYPASS_COVERAGE_CHECK }}" = "true" ]; then
            echo "⚠️ Coverage check bypassed - running tests without coverage requirements"
            yarn test:coverage:bypass
          else
            echo "✅ Running tests with 100% coverage requirement"
            yarn test:coverage
          fi

      - name: 📊 Analyze bundle
        run: yarn analyze

      # - name: 🔒 Security audit
      #   run: |
      #     echo "🔍 Running development security audit..."
      #     yarn audit --audit-level high

      - name: 🏗️ Build for development
        run: |
          echo "Building with Vite..."
          export VITE_APP_ENV=development
          export VITE_DEBUG_MODE=true
          export VITE_APP_VERSION="${{ secrets.VITE_APP_VERSION }}"
          export VITE_APP_NAME="${{ secrets.VITE_APP_NAME }}"
          export VITE_AUTH_GATEWAY_API_URL="${{ secrets.VITE_AUTH_GATEWAY_API_URL }}"
          export VITE_OPENMRS_API_URL="${{ secrets.VITE_OPENMRS_API_URL }}"
          export VITE_PORTAL_API_URL="${{ secrets.VITE_PORTAL_API_URL }}"
          export VITE_API_TIMEOUT="${{ secrets.VITE_API_TIMEOUT }}"
          export VITE_SENTRY_DSN="${{ secrets.VITE_SENTRY_DSN }}"
          export VITE_CONFIG_API_URL="${{ secrets.VITE_CONFIG_API_URL }}"
          export VITE_EMR_MIDDLEWARE_API_URL="${{ secrets.VITE_EMR_MIDDLEWARE_API_URL }}"
          export VITE_FIREBASE_API_KEY="${{ secrets.VITE_FIREBASE_API_KEY }}"
          export VITE_FIREBASE_AUTH_DOMAIN="${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}"
          export VITE_FIREBASE_PROJECT_ID="${{ secrets.VITE_FIREBASE_PROJECT_ID }}"
          export VITE_FIREBASE_STORAGE_BUCKET="${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}"
          export VITE_FIREBASE_MESSAGING_SENDER_ID="${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}"
          export VITE_FIREBASE_APP_ID="${{ secrets.VITE_FIREBASE_APP_ID }}"
          export VITE_FIREBASE_VAPID_KEY="${{ secrets.VITE_FIREBASE_VAPID_KEY }}"
          export VITE_ENABLE_SITE_CAPTCHA="${{ secrets.VITE_ENABLE_SITE_CAPTCHA }}"
          export VITE_RECAPTCHA_SITE_KEY="${{ secrets.VITE_RECAPTCHA_SITE_KEY }}"
          export VITE_PORTAL_SOCKET_URL="${{ secrets.VITE_PORTAL_SOCKET_URL }}"
          export VITE_WEBRTC_SDK_SERVER_URL="${{ secrets.VITE_WEBRTC_SDK_SERVER_URL }}"
          export VITE_WEBRTC_API_URL="${{ secrets.VITE_WEBRTC_API_URL }}"
          yarn build

      - name: 🔐 Setup SSH Key
        run: |
          echo "🔐 Setting up SSH key for server access..."
          # Create .ssh directory
          mkdir -p ~/.ssh
          # Set proper permissions
          chmod 700 ~/.ssh
          # Write the private key to file
          echo "${{ secrets.SERVER_PEM_KEY }}" > ~/.ssh/dev_server.pem
          # Set proper permissions for the key file
          chmod 600 ~/.ssh/dev_server.pem
          # Add server to known hosts to avoid host key verification prompt
          ssh-keyscan -H ${{ secrets.DEV_HOST }} >> ~/.ssh/known_hosts
          echo "✅ SSH key setup completed!"

      - name: 🧪 Test Server Connection
        run: |
          echo "🧪 Testing connection to development server..."
          ssh -i ~/.ssh/dev_server.pem -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.DEV_HOST }} "echo 'Connection successful!'"
          echo "✅ Server connection test passed!"

      - name: 🚀 Deploy to Development Server
        run: |
          echo "🚀 Deploying to development server..."

          # Validate required secrets
          if [ -z "${{ secrets.DEPLOY_PATH }}" ]; then
            echo "❌ Error: DEPLOY_PATH secret is not set"
            exit 1
          fi

          if [ -z "${{ secrets.BACKUP_PATH }}" ]; then
            echo "❌ Error: BACKUP_PATH secret is not set"
            exit 1
          fi

          echo "📁 Deploy path: ${{ secrets.DEPLOY_PATH }}"
          echo "📁 Backup path: ${{ secrets.BACKUP_PATH }}"

          # Create deployment directory on server
          ssh -i ~/.ssh/dev_server.pem -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.DEV_HOST }} "
            echo 'Creating directories...'
            # Create backup directory
            sudo mkdir -p '${{ secrets.BACKUP_PATH }}'
            sudo chmod 755 '${{ secrets.BACKUP_PATH }}'
            sudo chown ${{ secrets.SERVER_USER }}:${{ secrets.SERVER_USER }} '${{ secrets.BACKUP_PATH }}'
            
            # Create main deployment directory
            sudo mkdir -p '${{ secrets.DEPLOY_PATH }}'
            sudo chmod 755 '${{ secrets.DEPLOY_PATH }}'
            sudo chown ${{ secrets.SERVER_USER }}:${{ secrets.SERVER_USER }} '${{ secrets.DEPLOY_PATH }}'
            
            # Create temp directory with full permissions for server user
            sudo mkdir -p '${{ secrets.DEPLOY_PATH }}/temp'
            sudo chmod -R 777 '${{ secrets.DEPLOY_PATH }}/temp'
            sudo chown -R ${{ secrets.SERVER_USER }}:${{ secrets.SERVER_USER }} '${{ secrets.DEPLOY_PATH }}/temp'
            echo 'Directories created successfully!'
          "

          # Backup current deployment (if exists)
          ssh -i ~/.ssh/dev_server.pem -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.DEV_HOST }} "
            if [ -d '${{ secrets.DEPLOY_PATH }}' ] && [ \"\$(ls -A ${{ secrets.DEPLOY_PATH }})\" ]; then
              echo '📦 Creating backup of current deployment...'
              cp -r ${{ secrets.DEPLOY_PATH }}/* ${{ secrets.BACKUP_PATH }}/ 2>/dev/null || true
              echo '✅ Backup created successfully!'
            else
              echo 'ℹ️ No existing deployment to backup'
            fi
          "

          # Upload build files to temp directory first
          echo "📤 Uploading build files to server..."
          rsync -avz --delete --progress -e "ssh -i ~/.ssh/dev_server.pem -o StrictHostKeyChecking=no" \
            dist/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.DEV_HOST }}:${{ secrets.DEPLOY_PATH }}/temp/

          # Debug: Check what was uploaded to temp
          ssh -i ~/.ssh/dev_server.pem -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.DEV_HOST }} "
            echo '🔍 Debug: Contents uploaded to temp directory:'
            find '${{ secrets.DEPLOY_PATH }}/temp' -type f | head -20
            echo '📊 Total files in temp:'
            find '${{ secrets.DEPLOY_PATH }}/temp' -type f | wc -l
          "

          # Move files from temp to final location and set permissions
          ssh -i ~/.ssh/dev_server.pem -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.DEV_HOST }} "
            echo '🔄 Moving files to final location...'
            
            # Move files from temp to final location (including hidden files and directories)
            if [ -d '${{ secrets.DEPLOY_PATH }}/temp' ] && [ \"\$(ls -A '${{ secrets.DEPLOY_PATH }}/temp' 2>/dev/null)\" ]; then
              echo 'Moving files and directories from temp to final location...'
              
              # Clean up existing files and directories (except temp directory) BEFORE copying
              find '${{ secrets.DEPLOY_PATH }}' -maxdepth 1 -type f -delete 2>/dev/null || true
              find '${{ secrets.DEPLOY_PATH }}' -maxdepth 1 -type d ! -name temp ! -path '${{ secrets.DEPLOY_PATH }}' -exec rm -rf {} + 2>/dev/null || true
              
              # Debug: Show what's in temp before moving
              echo '🔍 Debug: Contents in temp before moving:'
              find '${{ secrets.DEPLOY_PATH }}/temp' -type f | head -20
              
              # Use rsync for better directory handling with sudo for permissions
              echo '🔄 Running rsync command with sudo...'
              sudo rsync -av '${{ secrets.DEPLOY_PATH }}/temp/' '${{ secrets.DEPLOY_PATH }}/' --exclude='temp'
              
              # Verify rsync worked immediately
              echo '🔍 Debug: Immediate verification after rsync:'
              ls -la '${{ secrets.DEPLOY_PATH }}/assets/js/' 2>/dev/null || echo 'assets/js not found after rsync'
              
              # Clean up temp directory
              rm -rf '${{ secrets.DEPLOY_PATH }}/temp' 2>/dev/null || true
              echo 'Files moved successfully!'
              
              # Debug: Verify what was moved
              echo '🔍 Debug: Contents in final location:'
              find '${{ secrets.DEPLOY_PATH }}' -type f | head -20
              echo '📊 Total files deployed:'
              find '${{ secrets.DEPLOY_PATH }}' -type f | wc -l
              echo '🔍 Debug: Specific assets/js directory:'
              ls -la '${{ secrets.DEPLOY_PATH }}/assets/js/' 2>/dev/null || echo 'assets/js directory not found'
              echo '🔍 Debug: All directories in deploy path:'
              find '${{ secrets.DEPLOY_PATH }}' -type d | head -10
            else
              echo 'No files to move from temp directory'
            fi
            
            echo '🔧 Setting proper permissions...'
            # Ensure all files and directories have correct permissions
            sudo find '${{ secrets.DEPLOY_PATH }}' -type d -exec chmod 755 {} \;
            sudo find '${{ secrets.DEPLOY_PATH }}' -type f -exec chmod 644 {} \;
            sudo chown -R www-data:www-data '${{ secrets.DEPLOY_PATH }}'
            echo '✅ Permissions set successfully!'
          "

          # Update web server configuration (if needed)
          ssh -i ~/.ssh/dev_server.pem -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.DEV_HOST }} "
            echo '🌐 Updating web server configuration...'
            echo '✅ Web server configuration updated!'
          "

          echo "✅ Development deployment completed successfully!"

      - name: 🧹 Cleanup
        if: always()
        run: |
          echo "🧹 Cleaning up temporary files..."
          # Remove the private key file for security
          rm -f ~/.ssh/dev_server.pem
          echo "✅ Cleanup completed!"

      - name: 📧 Notify deployment to Slack
        if: always()
        run: |
          # Check if notifications are enabled
          if [ "${{ secrets.SEND_NOTIFICATIONS }}" = "true" ] || [ "${{ secrets.SEND_NOTIFICATIONS }}" = "1" ]; then
            echo "📧 Sending deployment notification to Slack..."

            # Determine deployment status
            if [ "${{ job.status }}" = "success" ]; then
              STATUS_EMOJI="✅"
              STATUS_COLOR="good"
              STATUS_TEXT="SUCCESS"
            else
              STATUS_EMOJI="❌"
              STATUS_COLOR="danger"
              STATUS_TEXT="FAILED"
            fi

            # Prepare Slack message
            DEPLOYMENT_TIME=$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')
            TIMESTAMP=$(date +%s)
            
            SLACK_MESSAGE="{\"channel\":\"${{ secrets.SLACK_CHANNEL }}\",\"username\":\"GitHub Actions\",\"icon_emoji\":\":rocket:\",\"attachments\":[{\"color\":\"$STATUS_COLOR\",\"title\":\"$STATUS_EMOJI Development Deployment $STATUS_TEXT\",\"title_link\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"fields\":[{\"title\":\"Repository\",\"value\":\"${{ github.repository }}\",\"short\":true},{\"title\":\"Branch\",\"value\":\"${{ github.ref_name }}\",\"short\":true},{\"title\":\"Commit\",\"value\":\"<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\",\"short\":true},{\"title\":\"Author\",\"value\":\"${{ github.actor }}\",\"short\":true},{\"title\":\"Environment\",\"value\":\"Development\",\"short\":true},{\"title\":\"Deployment Time\",\"value\":\"$DEPLOYMENT_TIME\",\"short\":true},{\"title\":\"Server\",\"value\":\"${{ secrets.DEV_HOST }}\",\"short\":true}],\"footer\":\"GitHub Actions\",\"footer_icon\":\"https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png\",\"ts\":$TIMESTAMP}]}"

            # Send notification to Slack
            curl -X POST -H 'Content-type: application/json' \
              --data "$SLACK_MESSAGE" \
              "${{ secrets.SLACK_WEBHOOK_URL }}"

            echo "✅ Slack notification sent successfully!"
          else
            echo "🔕 Slack notifications are disabled (SEND_NOTIFICATIONS = ${{ secrets.SEND_NOTIFICATIONS }})"
          fi
